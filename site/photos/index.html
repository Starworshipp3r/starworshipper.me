<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/assets/theme-bootstrap.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DUMBDOG HAS A CAMERA</title>

  <meta name="theme-color" content="#0b0f18" />
  <meta name="description" content="A messy little pile of polaroids you can scatter around." />
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" href="/favicon.ico?v=star-boykisser-2" sizes="any" />
  <link rel="icon" href="/favicon.svg?v=star-boykisser-2" type="image/svg+xml" />
  <link rel="preload" href="/cork.jpg" as="image" />

  <link rel="stylesheet" href="/assets/tailwind.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg: #0b0f18;
      --bg2: #0a0d16;
      --fg: rgba(255,255,255,.92);
      --accent: #7aa2ff;
      --accent-glow: rgba(122,162,255,.20);
      --glass: rgba(18, 22, 32, .56);
      --border: rgba(255,255,255,.14);
      --border-2: rgba(255,255,255,.10);
      --shadow: 0 30px 80px rgba(0,0,0,.55);
      --shadow-soft: 0 12px 35px rgba(0,0,0,.35);
      --radius-xl: 22px;
      --radius-lg: 16px;
      --radius-md: 14px;
      --noise: url("/assets/noise.png");
    }

    html, body { height: 100%; }
    body{
      font-family: "Segoe UI Variable", "Segoe UI", "Inter", system-ui, -apple-system, sans-serif;
      background: linear-gradient(180deg, var(--bg), var(--bg2));
      color: var(--fg);
      overflow: hidden;
    }

    a.inline-link{
      color: rgba(255,255,255,.86);
      text-decoration: underline;
      text-decoration-color: rgba(255,255,255,.35);
    }

    @keyframes rotate-background {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    body::before{
      content:'';
      position: fixed;
      top: 50%;
      left: 50%;
      width: 150vmax;
      height: 150vmax;
      margin-top: -75vmax;
      margin-left: -75vmax;
      background-image:
        radial-gradient(circle at 30% 30%, var(--color-1, rgba(100, 100, 255, 0.25)), transparent 45%),
        radial-gradient(circle at 70% 70%, var(--color-2, rgba(255, 100, 150, 0.25)), transparent 45%);
      z-index: -2;
      animation: rotate-background 90s linear infinite;
      animation-delay: var(--bg-delay, 0s);
      will-change: transform;
    }

    .mica-shell{
      border-radius: var(--radius-xl);
      border: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02)),
                  radial-gradient(900px 240px at 20% 0%, rgba(255,255,255,.10), transparent 60%),
                  var(--glass);
      background-clip: padding-box;
      backdrop-filter: blur(28px) saturate(1.25);
      -webkit-backdrop-filter: blur(22px) saturate(1.25);
      box-shadow: var(--shadow);
      overflow: hidden;
      position: relative;
    }

    .mica-shell::before{
      content:'';
      position:absolute;
      inset: 0;
      background:
        linear-gradient(135deg, rgba(255,255,255,.20), transparent 40%),
        radial-gradient(900px 280px at 10% 0%, rgba(255,255,255,.18), transparent 60%);
      opacity: .2;
      pointer-events:none;
    }

    .mica-shell::after{
      content:'';
      position:absolute;
      inset:0;
      background-image: var(--noise);
      background-size: 128px 128px;
      opacity: .06;
      pointer-events:none;
    }

    .mica-shell > * { position: relative; z-index: 1; }

    .mica-icon-btn{
      background: rgba(255,255,255,.06);
      border: 1px solid var(--border-2);
      border-radius: 9999px;
      width: 44px;
      height: 44px;
      display:flex;
      align-items:center;
      justify-content:center;
      flex: 0 0 auto;
      box-shadow: var(--shadow-soft);
      transition: transform .15s ease, background .15s ease, border-color .15s ease;
    }

    .mica-icon-btn:hover{
      transform: translateY(-1px);
      background: rgba(255,255,255,.10);
      border-color: rgba(255,255,255,.16);
    }

    .mica-icon-btn:active{
      transform: translateY(0px) scale(.98);
      background: rgba(255,255,255,.08);
    }

    .tool-btn{
      padding: .7rem 1rem;
      border-radius: .9rem;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.05);
      color: rgba(255,255,255,.86);
      transition: background .15s ease, transform .15s ease;
    }

    .tool-btn:hover{
      background: rgba(255,255,255,.10);
      transform: translateY(-1px);
    }

    .tool-btn:disabled{
      opacity: .6;
      cursor: wait;
      transform: none;
    }

    .photo-actions{
      display: flex;
      align-items: center;
      gap: .5rem;
    }

    .board{
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: calc(var(--radius-xl) - 6px);
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(255,255,255,.05), rgba(0,0,0,.06)),
        url("/cork.jpg") center / 420px auto repeat;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.08), inset 0 -18px 45px rgba(0,0,0,.10);
      isolation: isolate;
    }

    .board::before{
      content:'';
      position:absolute;
      inset:0;
      background:
        radial-gradient(circle at 16% 18%, rgba(255,255,255,.12), transparent 18%),
        radial-gradient(circle at 78% 24%, rgba(255,255,255,.06), transparent 14%),
        radial-gradient(circle at 62% 78%, rgba(0,0,0,.10), transparent 24%);
      mix-blend-mode:soft-light;
      pointer-events:none;
    }

    .board::after{
      content:'';
      position:absolute;
      inset:0;
      background:
        linear-gradient(90deg, rgba(255,255,255,.04), transparent 14%, transparent 86%, rgba(0,0,0,.12)),
        radial-gradient(circle at 50% 50%, rgba(0,0,0,.14), transparent 58%);
      pointer-events:none;
    }

    .note{
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(16, 18, 24, .34);
      backdrop-filter: blur(14px);
      box-shadow: 0 20px 40px rgba(0,0,0,.25);
    }

    .polaroid{
      position: absolute;
      width: clamp(170px, 18vw, 240px);
      background: linear-gradient(180deg, rgba(255,255,255,.98), rgba(247,244,239,.96));
      color: #2b221c;
      border-radius: 6px;
      padding: 12px 12px 16px;
      box-shadow: 0 18px 42px rgba(0,0,0,.35), 0 2px 0 rgba(255,255,255,.45) inset;
      transform-origin: center center;
      cursor: grab;
      user-select: none;
      touch-action: none;
      transition: left .9s cubic-bezier(.22,.82,.26,1), top .9s cubic-bezier(.22,.82,.26,1), transform .9s cubic-bezier(.22,.82,.26,1), box-shadow .18s ease, opacity .24s ease;
    }

    .polaroid.is-pack-hidden{
      opacity: 0;
      pointer-events: none;
    }

    .polaroid.is-pack-preparing{
      opacity: 0;
      transition: none;
      pointer-events: none;
    }

    .polaroid:active{
      cursor: grabbing;
    }

    .polaroid.is-dragging,
    .polaroid.is-focused{
      box-shadow: 0 26px 60px rgba(0,0,0,.45), 0 0 0 3px rgba(255,255,255,.24);
    }

    .polaroid.is-focused{
      transform: scale(1.04) rotate(var(--rotation, 0deg)) !important;
    }

    .focus-backdrop{
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(0,0,0,.18), rgba(0,0,0,.48));
      opacity: 0;
      pointer-events: none;
      transition: opacity .35s ease;
      z-index: 30;
    }

    .board.has-zoomed .focus-backdrop{
      opacity: 1;
      pointer-events: auto;
    }

    .board.has-zoomed .polaroid:not(.is-zoomed){
      opacity: 0;
      pointer-events: none;
    }

    .polaroid.is-zoomed {
      position: absolute;
      left: 50% !important;
      top: 50% !important;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      overflow: hidden;
      transform: translate(-50%, -50%) rotate(0deg) scale(1.02) !important;
      box-shadow: 0 34px 100px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.3);
      z-index: 40 !important;
    }

    .polaroid.is-zoomed img {
      width: auto;
      height: auto;
      aspect-ratio: auto;
      object-fit: contain;
      margin: 0 auto;
      flex: 0 0 auto;
    }

    .polaroid.is-zoomed .polaroid-footer {
      flex: 0 0 30px;
      width: 100%;
    }

    .board.has-zoomed .note,
    .board.has-zoomed .empty-state {
      opacity: 0;
      pointer-events: none;
    }

    .attribution-chip {
      position: absolute;
      right: 18px;
      bottom: 18px;
      max-width: min(360px, calc(100% - 36px));
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.12);
      background: linear-gradient(180deg, rgba(18, 21, 28, .78), rgba(12, 14, 20, .7));
      backdrop-filter: blur(14px);
      box-shadow: 0 14px 34px rgba(0,0,0,.24);
      color: rgba(255,255,255,.74);
      font-size: .72rem;
      line-height: 1.35;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease, transform .2s ease;
      transform: translateY(6px);
      z-index: 41;
    }

    .board.has-zoomed .attribution-chip,
    .board.has-mobile-focus .attribution-chip {
      opacity: 1;
      pointer-events: auto;
      transform: none;
    }

    .attribution-chip a {
      color: rgba(255,255,255,.94);
      text-decoration: underline;
      text-decoration-color: rgba(255,255,255,.28);
      text-underline-offset: 2px;
    }

    .attribution-label {
      display: inline-block;
      margin-right: 8px;
      color: rgba(255,255,255,.5);
      text-transform: uppercase;
      letter-spacing: .12em;
      font-size: .6rem;
    }

    .mobile-focus{
      position: absolute;
      inset: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s ease;
      z-index: 42;
    }

    .board.has-mobile-focus .mobile-focus{
      opacity: 1;
      pointer-events: auto;
    }

    .board.has-mobile-focus .focus-backdrop{
      opacity: 1;
      pointer-events: auto;
    }

    .board.has-mobile-focus .polaroid,
    .board.has-mobile-focus .note,
    .board.has-mobile-focus .empty-state{
      opacity: 0;
      pointer-events: none;
    }

    .mobile-focus-card{
      width: min(calc(100% - 20px), 520px);
      max-width: 100%;
      max-height: calc(100% - 20px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 12px 12px 16px;
      border-radius: 6px;
      background: linear-gradient(180deg, rgba(255,255,255,.98), rgba(247,244,239,.96));
      box-shadow: 0 18px 44px rgba(0,0,0,.34), 0 2px 0 rgba(255,255,255,.45) inset;
      transform: translateY(12px) scale(.975) translateZ(0);
      backface-visibility: hidden;
      transition: transform .24s cubic-bezier(.2,.8,.2,1), opacity .18s ease;
      opacity: 0;
    }

    .board.has-mobile-focus .mobile-focus-card{
      transform: translateY(0) scale(1) translateZ(0);
      opacity: 1;
    }

    .mobile-focus-image{
      width: 100%;
      flex: 1 1 auto;
      min-height: 0;
      object-fit: contain;
      border-radius: 2px;
      background: #d8d3cc;
      box-shadow: 0 1px 0 rgba(0,0,0,.12);
      transform: translateZ(0);
      backface-visibility: hidden;
    }

    .mobile-focus-footer{
      width: 100%;
      height: 30px;
      flex: 0 0 30px;
    }
    .polaroid img{
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      display: block;
      border-radius: 2px;
      pointer-events: none;
      box-shadow: 0 1px 0 rgba(0,0,0,.12);
      transform: translateZ(0);
      backface-visibility: hidden;
      background: #d8d3cc;
    }

    .polaroid-footer{
      height: 30px;
    }

    .polaroid-pin{
      position:absolute;
      top: 9px;
      right: 9px;
      width: 12px;
      height: 12px;
      border-radius: 9999px;
      background: radial-gradient(circle at 35% 35%, rgba(255,255,255,.95), rgba(255,255,255,.1) 35%, rgba(0,0,0,.25) 100%);
      box-shadow: 0 1px 2px rgba(0,0,0,.25);
      pointer-events:none;
    }


    .status-pill{
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06);
      padding: .35rem .7rem;
      font-size: .75rem;
      color: rgba(255,255,255,.72);
    }

    .empty-state{
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      padding: 2rem;
    }

    .empty-state.is-visible{
      display: flex;
    }

    html.js .mica-shell{
      opacity: 0;
      transform: translateY(20px) scale(.97);
      filter: blur(8px);
      transition: opacity 800ms cubic-bezier(.16,.84,.44,1),
                  transform 800ms cubic-bezier(.16,.84,.44,1),
                  filter 800ms cubic-bezier(.16,.84,.44,1);
      will-change: transform, opacity, filter;
    }

    html.js body.is-ready .mica-shell{
      opacity: 1;
      transform: none;
      filter: none;
      will-change: auto;
    }

    html.js body.is-leaving .mica-shell{
      opacity: 0;
      transform: translateY(-6px) scale(.985);
      filter: none;
      transition: opacity 280ms ease-out,
                  transform 300ms cubic-bezier(.2,.8,.2,1),
                  filter 0ms linear;
    }

    @media (max-width: 768px){
      body{
        overflow: auto;
      }

      .photo-actions{
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        width: 100%;
      }

      .photo-actions .tool-btn{
        min-width: 0;
        padding-inline: .75rem;
        white-space: nowrap;
      }

      .board{
        min-height: calc(100dvh - 230px);
      }

      .focus-backdrop{
        transition: opacity .16s ease;
      }

      .mobile-focus{
        inset: 8px;
      }

      .mobile-focus-card{
        width: min(calc(100% - 12px), 500px);
        max-height: calc(100% - 12px);
        box-shadow: 0 14px 34px rgba(0,0,0,.28), 0 2px 0 rgba(255,255,255,.45) inset;
      }

      .attribution-chip{
        max-width: calc(100% - 24px);
        right: 12px;
        bottom: 12px;
      }
    }
    @media (prefers-reduced-motion: reduce){
      body::before{ animation: none; }
      html.js .mica-shell{
        transition: none !important;
        filter: none !important;
        transform: none !important;
        opacity: 1 !important;
      }
      .polaroid{
        transition: none !important;
      }
    }
  </style>
</head>

<body class="min-h-screen p-2 sm:p-4 lg:p-6">
  <div class="mica-shell w-full max-w-[1700px] mx-auto min-h-[calc(100vh-1rem)] sm:min-h-[calc(100vh-2rem)] lg:min-h-[calc(100vh-3rem)] flex flex-col">
    <div class="p-5 sm:p-6 border-b border-white/10 bg-white/5 flex flex-col gap-4 lg:flex-row lg:items-center lg:justify-between">
      <div class="flex items-center gap-3 min-w-0">
        <a class="mica-icon-btn" href="/site/" aria-label="Back to site" title="Back">
          <i class="fa-solid fa-arrow-left"></i>
        </a>
        <div class="min-w-0">
          <div class="text-2xl font-bold leading-tight">Photos</div>
          <div class="text-white/65 text-sm">Fresh random polaroids from Unsplash. Drag them, stack them, or pull a new batch.</div>
        </div>
      </div>

      <div class="photo-actions">
        <button id="refreshBtn" type="button" class="tool-btn">
          Open a fresh pack
        </button>
        <button id="layoutBtn" type="button" class="tool-btn" aria-label="Stack photos">
          <span id="layoutLabel">Stack 'em up</span>
        </button>
      </div>
    </div>

    <div class="p-4 sm:p-5 lg:p-6 flex-1">
      <div id="board" class="board h-full min-h-[680px]">
        <div class="note absolute left-4 top-4 sm:left-6 sm:top-6 max-w-sm px-4 py-3 text-white/75 text-sm">
          Click a polaroid to focus it. Drag anywhere on the card to toss it around the board.
        </div>

        <div id="focusBackdrop" class="focus-backdrop"></div>

        <div id="emptyState" class="empty-state">
          <div class="note max-w-md px-5 py-4 text-white/78 text-sm text-center">
            No photos loaded yet. Pull a set from Unsplash to fill the board.
          </div>
        </div>

        <div id="attributionChip" class="attribution-chip" aria-live="polite"></div>

        <div id="mobileFocus" class="mobile-focus" hidden>
          <article class="mobile-focus-card" aria-modal="true" role="dialog" aria-label="Focused photo">
            <img id="mobileFocusImage" class="mobile-focus-image" alt="Focused photo" />
            <div class="mobile-focus-footer" aria-hidden="true"></div>
          </article>
        </div>

      </div>
    </div>
  </div>

  <script>
    const root = document.documentElement;
    const board = document.getElementById('board');
    const refreshBtn = document.getElementById('refreshBtn');
    const layoutBtn = document.getElementById('layoutBtn');
    const layoutLabel = document.getElementById('layoutLabel');
    const emptyState = document.getElementById('emptyState');
    const focusBackdrop = document.getElementById('focusBackdrop');
    const attributionChip = document.getElementById('attributionChip');
    const mobileFocus = document.getElementById('mobileFocus');
    const mobileFocusImage = document.getElementById('mobileFocusImage');
    const mobileFocusMedia = window.matchMedia('(max-width: 768px)');

    let zCounter = 10;
    let cards = [];
    let currentPhotos = [];
    let autoScatterTimer = null;
    let zoomedCard = null;
    let mobileFocusPhoto = null;
    let isStacked = false;
    const photoFoleyUrls = [
      '/site/photos/audio/paper-foley-1.wav',
      '/site/photos/audio/paper-foley-2.wav',
      '/site/photos/audio/paper-foley-3.wav'
    ];
    const photoFoleyGain = 0.8;
    let photoAudioContext = null;
    let photoFoleyBuffersPromise = null;
    let lastPhotoFoleyIndex = -1;

    function preparePhotoFoley() {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return Promise.resolve([]);

      if (!photoAudioContext) photoAudioContext = new AudioContext();
      if (!photoFoleyBuffersPromise) {
        photoFoleyBuffersPromise = Promise.all(photoFoleyUrls.map(async (url) => {
          const response = await fetch(url);
          if (!response.ok) throw new Error(`Unable to load ${url}`);
          return photoAudioContext.decodeAudioData(await response.arrayBuffer());
        })).catch(() => []);
      }

      return photoFoleyBuffersPromise;
    }

    function unlockPhotoFoley() {
      const buffersPromise = preparePhotoFoley();
      if (photoAudioContext?.state === 'suspended') {
        photoAudioContext.resume().catch(() => {});
      }
      return buffersPromise;
    }

    async function playPhotoFoley() {
      const buffers = await unlockPhotoFoley();
      if (!photoAudioContext || !buffers.length) return;

      let index = Math.floor(Math.random() * buffers.length);
      if (buffers.length > 1) {
        while (index === lastPhotoFoleyIndex) {
          index = Math.floor(Math.random() * buffers.length);
        }
      }
      lastPhotoFoleyIndex = index;

      const source = photoAudioContext.createBufferSource();
      const gain = photoAudioContext.createGain();
      source.buffer = buffers[index];
      gain.gain.value = photoFoleyGain;
      source.connect(gain);
      gain.connect(photoAudioContext.destination);
      source.start();
    }

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function setStatus() {}

    function withReferral(url) {
      if (!url) return '';
      const ref = new URL(url);
      ref.searchParams.set('utm_source', 'starworshipper.me');
      ref.searchParams.set('utm_medium', 'referral');
      return ref.toString();
    }

    function updateInspector(photo) {
      if (!attributionChip || !photo) return;
      const photographer = photo.userName || photo.meta || 'Photographer';
      const profileUrl = withReferral(photo.userProfile || 'https://unsplash.com');
      const photoUrl = withReferral(photo.photoPage || 'https://unsplash.com');
      const unsplashUrl = withReferral('https://unsplash.com');
      attributionChip.innerHTML = `<span class="attribution-label">Photo</span><a href="${profileUrl}" target="_blank" rel="noopener noreferrer">${photographer}</a> on <a href="${unsplashUrl}" target="_blank" rel="noopener noreferrer">Unsplash</a> · <a href="${photoUrl}" target="_blank" rel="noopener noreferrer">View</a>`;
    }

    function isMobileFocusMode() {
      return mobileFocusMedia.matches;
    }

    function clearMobileFocus() {
      mobileFocusPhoto = null;
      if (mobileFocus) {
        mobileFocus.hidden = true;
      }
      if (mobileFocusImage) {
        mobileFocusImage.removeAttribute('src');
        mobileFocusImage.alt = 'Focused photo';
      }
      board.classList.remove('has-mobile-focus');
    }

    function clearZoom() {
      if (mobileFocusPhoto) {
        board.classList.remove('has-mobile-focus');
        board.classList.remove('has-zoomed');
        clearMobileFocus();
      }
      if (!zoomedCard) return;
      zoomedCard.classList.remove('is-zoomed');
      zoomedCard.style.width = '';
      zoomedCard.style.height = '';
      const img = zoomedCard.querySelector('img');
      if (img) {
        img.style.width = '';
        img.style.height = '';
      }
      board.classList.remove('has-zoomed');
      zoomedCard = null;
    }

    function openMobileFocus(photo) {
      if (!mobileFocus || !mobileFocusImage) return;
      if (mobileFocusPhoto?.src === photo.src) {
        clearZoom();
        return;
      }
      clearZoom();
      mobileFocusPhoto = photo;
      mobileFocus.hidden = false;
      mobileFocusImage.src = photo.src;
      mobileFocusImage.alt = photo.title || 'Unsplash photo';
      board.classList.add('has-mobile-focus');
    }

    function sizeZoomedCard(card) {
      const img = card.querySelector('img');
      const footer = card.querySelector('.polaroid-footer');
      if (!img || !footer) return;

      const boardRect = board.getBoundingClientRect();
      const padX = 24;
      const padTop = 12;
      const padBottom = 16;
      const footerH = footer.offsetHeight || 30;
      const maxCardW = Math.max(220, boardRect.width - 56);
      const maxCardH = Math.max(220, boardRect.height - 56);
      const maxImgW = maxCardW - padX;
      const maxImgH = maxCardH - padTop - padBottom - footerH;
      const naturalW = img.naturalWidth || img.clientWidth || 1;
      const naturalH = img.naturalHeight || img.clientHeight || 1;
      const scale = Math.min(maxImgW / naturalW, maxImgH / naturalH);
      const imgW = Math.max(1, Math.floor(naturalW * scale));
      const imgH = Math.max(1, Math.floor(naturalH * scale));

      img.style.width = `${imgW}px`;
      img.style.height = `${imgH}px`;
      card.style.width = `${imgW + padX}px`;
      card.style.height = `${imgH + padTop + padBottom + footerH}px`;
    }

    function toggleZoom(card, photo) {
      if (isMobileFocusMode()) {
        openMobileFocus(photo);
        return;
      }

      if (zoomedCard === card) {
        clearZoom();
        return;
      }

      if (zoomedCard) {
        clearZoom();
      }

      zoomedCard = card;
      board.classList.add('has-zoomed');
      card.classList.add('is-zoomed');
      card.style.zIndex = String(++zCounter);
      sizeZoomedCard(card);
    }

    function setEmptyState(visible, message) {
      emptyState.classList.toggle('is-visible', visible);
      if (message) {
        emptyState.querySelector('.note').textContent = message;
      }
    }

    function focusCard(card, photo) {
      cards.forEach((entry) => entry.el.classList.remove('is-focused'));
      card.classList.add('is-focused');
      card.style.zIndex = String(++zCounter);
      updateInspector(photo);
      setStatus(`${currentPhotos.length} loaded`, 'images');
    }

    function computeLayout(index, total, cardWidth, cardHeight) {
      const boardWidth = board.clientWidth;
      const boardHeight = board.clientHeight;
      const usableWidth = Math.max(boardWidth - cardWidth - 24, 24);
      const usableHeight = Math.max(boardHeight - cardHeight - 24, 24);

      if (boardWidth >= 900 && total >= 5) {
        const firstRowCount = Math.ceil(total / 2);
        const row = index < firstRowCount ? 0 : 1;
        const rowIndex = row === 0 ? index : index - firstRowCount;
        const itemsInRow = row === 0 ? firstRowCount : total - firstRowCount;
        const horizontalPosition = itemsInRow === 1
          ? 0.5
          : row === 0
            ? rowIndex / (itemsInRow - 1)
            : (rowIndex + 0.5) / itemsInRow;
        const leftBase = 12 + usableWidth * horizontalPosition;
        const topBase = row === 0
          ? 100
          : 100 + Math.max(usableHeight - 100, 80) * 0.72;

        const jitterX = Math.round((Math.random() - 0.5) * 54);
        const jitterY = Math.round((Math.random() - 0.5) * 44);
        const rotation = `${Math.round((Math.random() - 0.5) * 24)}deg`;

        return {
          left: clamp(leftBase + jitterX, 12, usableWidth),
          top: clamp(topBase + jitterY, 84, usableHeight),
          rotation
        };
      }

      const cols = Math.max(2, Math.ceil(Math.sqrt(total)));
      const rows = Math.max(2, Math.ceil(total / cols));
      const col = index % cols;
      const row = Math.floor(index / cols);

      const leftBase = 12 + (usableWidth / Math.max(1, cols - 1)) * col;
      const topBase = 88 + (Math.max(usableHeight - 88, 80) / Math.max(1, rows - 1)) * row;

      const jitterX = Math.round((Math.random() - 0.5) * 90);
      const jitterY = Math.round((Math.random() - 0.5) * 70);
      const rotation = `${Math.round((Math.random() - 0.5) * 28)}deg`;

      return {
        left: clamp(leftBase + jitterX, 12, usableWidth),
        top: clamp(topBase + jitterY, 84, usableHeight),
        rotation
      };
    }

    function setCardPosition(card, layout) {
      card.style.left = `${layout.left}px`;
      card.style.top = `${layout.top}px`;
      card.style.setProperty('--rotation', layout.rotation);
      card.style.transform = `rotate(${layout.rotation})`;
    }

    function cancelAutoScatter() {
      if (autoScatterTimer) {
        clearTimeout(autoScatterTimer);
        autoScatterTimer = null;
      }
    }

    function scheduleAutoScatter(delay = 1800, withSound = false) {
      cancelAutoScatter();
      autoScatterTimer = setTimeout(() => {
        autoScatterTimer = null;
        if (withSound) playPhotoFoley();
        scatterCards();
      }, delay);
    }

    function updateLayoutButton() {
      const label = isStacked ? "Spread 'em out" : "Stack 'em up";
      layoutLabel.textContent = label;
      layoutBtn.setAttribute('aria-label', isStacked ? 'Spread photos out' : 'Stack photos');
      layoutBtn.title = label;
    }

    function scatterCards() {
      cards.forEach((entry, index) => {
        const layout = computeLayout(index, cards.length, entry.el.offsetWidth, entry.el.offsetHeight);
        setCardPosition(entry.el, layout);
      });
      isStacked = false;
      updateLayoutButton();
    }

    function stackCards() {
      const stackLeft = Math.max(board.clientWidth * 0.5 - 120, 18);
      const stackTop = Math.max(board.clientHeight * 0.22, 110);

      cards.forEach((entry, index) => {
        const rotation = `${-10 + index * 5}deg`;
        entry.el.style.left = `${stackLeft + index * 18}px`;
        entry.el.style.top = `${stackTop + index * 18}px`;
        entry.el.style.setProperty('--rotation', rotation);
        entry.el.style.transform = `rotate(${rotation})`;
        entry.el.style.zIndex = String(++zCounter);
      });
      isStacked = true;
      updateLayoutButton();
    }

    function wireDrag(card, photo) {
      let dragState = null;
      let moved = false;

      card.addEventListener('pointerdown', (event) => {
        if (event.button !== 0) return;
        if (card.classList.contains('is-zoomed')) return;

        cancelAutoScatter();
        clearZoom();
        focusCard(card, photo);
        moved = false;
        card.classList.add('is-dragging');
        card.setPointerCapture(event.pointerId);

        const rect = card.getBoundingClientRect();
        const boardRect = board.getBoundingClientRect();

        dragState = {
          pointerId: event.pointerId,
          offsetX: event.clientX - rect.left,
          offsetY: event.clientY - rect.top,
          width: rect.width,
          height: rect.height,
          boardRect
        };
      });

      card.addEventListener('pointermove', (event) => {
        if (!dragState || event.pointerId !== dragState.pointerId) return;
        if (!moved && isStacked) {
          isStacked = false;
          updateLayoutButton();
        }
        moved = true;

        const left = clamp(
          event.clientX - dragState.boardRect.left - dragState.offsetX,
          6,
          Math.max(6, board.clientWidth - dragState.width - 6)
        );
        const top = clamp(
          event.clientY - dragState.boardRect.top - dragState.offsetY,
          6,
          Math.max(6, board.clientHeight - dragState.height - 6)
        );

        card.style.left = `${left}px`;
        card.style.top = `${top}px`;
        card.style.transform = `rotate(${card.style.getPropertyValue('--rotation') || '0deg'})`;
      });

      function stopDragging(event) {
        if (!dragState || event.pointerId !== dragState.pointerId) return;
        card.classList.remove('is-dragging');
        dragState = null;
      }

      card.addEventListener('pointerup', stopDragging);
      card.addEventListener('pointercancel', stopDragging);
      card.addEventListener('click', () => {
        focusCard(card, photo);
        if (!moved) toggleZoom(card, photo);
      });
    }

    function clearBoard() {
      cards.forEach((entry) => entry.el.remove());
      cards = [];
      currentPhotos = [];
      clearZoom();
    }

    function createCard(photo, index, { preparing = false } = {}) {
      const card = document.createElement('article');
      card.className = preparing ? 'polaroid is-pack-preparing' : 'polaroid';
      card.style.zIndex = String(++zCounter);
      card.innerHTML = `
        <span class="polaroid-pin"></span>
        <img src="${photo.src}" alt="${photo.title || 'Unsplash photo'}" loading="lazy">
        <div class="polaroid-footer" aria-hidden="true"></div>
      `;

      board.appendChild(card);
      cards.push({ el: card, photo });
      wireDrag(card, photo);
    }

    function wait(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    function preloadPhotos(photos) {
      return Promise.allSettled(photos.map((photo) => new Promise((resolve) => {
        const image = new Image();
        image.onload = resolve;
        image.onerror = resolve;
        image.src = photo.src;
      })));
    }

    async function replaceStackedPack(photos, withScatterSound) {
      cards.forEach((entry) => entry.el.classList.add('is-pack-hidden'));
      await wait(240);

      clearBoard();
      currentPhotos = photos.slice();
      setEmptyState(false);
      currentPhotos.forEach((photo, index) => createCard(photo, index, { preparing: true }));
      stackCards();

      void board.offsetHeight;
      cards.forEach((entry) => entry.el.classList.remove('is-pack-preparing'));
      await wait(360);

      if (withScatterSound) playPhotoFoley();
      scatterCards();
    }

    function renderBoard(photos, withScatterSound = false) {
      clearBoard();
      currentPhotos = photos.slice();

      if (!currentPhotos.length) {
        setEmptyState(true, 'No photos came back from Unsplash.');
        return;
      }

      setEmptyState(false);
      currentPhotos.forEach(createCard);
      stackCards();
      scheduleAutoScatter(1800, withScatterSound);
    }

    async function fetchPhotos({ withScatterSound = false, animateRefresh = false } = {}) {
      refreshBtn.disabled = true;
      setStatus('loading');
      const hasExistingPack = animateRefresh && cards.length > 0;
      let collectPromise = Promise.resolve();

      if (hasExistingPack) {
        stackCards();
        collectPromise = wait(900);
      }

      try {
        const res = await fetch('/.netlify/functions/unsplash-photos?count=9');
        const data = res.ok ? await res.json() : null;

        if (!res.ok || !data?.photos?.length) {
          throw new Error(data?.error || 'No photos returned');
        }

        if (hasExistingPack) {
          await Promise.all([collectPromise, preloadPhotos(data.photos)]);
          await replaceStackedPack(data.photos, withScatterSound);
        } else {
          renderBoard(data.photos, withScatterSound);
        }
      } catch (error) {
        if (hasExistingPack) {
          scatterCards();
        } else {
          clearBoard();
          setEmptyState(true, 'Unable to load photos from Unsplash right now.');
        }
        setStatus('error');
      } finally {
        setStatus('ready');
        refreshBtn.disabled = false;
      }
    }

    function revealPage() {
      requestAnimationFrame(() => {
        requestAnimationFrame(() => document.body.classList.add('is-ready'));
      });
    }

    function revealPageWhenTextureIsReady() {
      const texture = new Image();
      let revealed = false;

      const reveal = () => {
        if (revealed) return;
        revealed = true;
        clearTimeout(fallbackTimer);
        revealPage();
      };

      const revealAfterDecode = async () => {
        try {
          if (texture.decode) await texture.decode();
        } catch {}
        reveal();
      };

      const fallbackTimer = setTimeout(reveal, 2500);
      texture.addEventListener('load', revealAfterDecode, { once: true });
      texture.addEventListener('error', reveal, { once: true });
      texture.src = '/cork.jpg';
      if (texture.complete) revealAfterDecode();
    }

    function enablePageTransitions() {
      document.addEventListener('click', (e) => {
        const a = e.target.closest('a');
        if (!a) return;
        if (e.button !== 0) return;
        if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
        if (a.target && a.target !== '_self') return;
        if (a.hasAttribute('download')) return;

        const href = a.getAttribute('href');
        if (!href || href.startsWith('#')) return;

        let url;
        try { url = new URL(a.href, window.location.href); } catch { return; }
        if (url.origin !== window.location.origin) return;
        if (url.pathname === location.pathname && url.search === location.search && url.hash) return;

        e.preventDefault();
        document.body.classList.add('is-leaving');

        const delay = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 300;
        setTimeout(() => { window.location.href = url.href; }, delay);
      });

      window.addEventListener('pageshow', (event) => {
        document.body.classList.remove('is-leaving');
        if (event.persisted) revealPage();
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      enablePageTransitions();

      refreshBtn.addEventListener('click', () => {
        cancelAutoScatter();
        unlockPhotoFoley();
        fetchPhotos({ withScatterSound: true, animateRefresh: true });
      });
      layoutBtn.addEventListener('click', () => {
        cancelAutoScatter();
        playPhotoFoley();
        if (isStacked) {
          scatterCards();
        } else {
          stackCards();
        }
      });

      let resizeTimer = null;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          if (zoomedCard) {
            sizeZoomedCard(zoomedCard);
            return;
          }
          if (mobileFocusPhoto) return;
          if (cards.length) scatterCards();
        }, 120);
      });

      focusBackdrop.addEventListener('click', clearZoom);
      mobileFocus?.addEventListener('click', clearZoom);
      board.addEventListener('click', (event) => {
        if (event.target === board) clearZoom();
      });
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') clearZoom();
      });
      mobileFocusMedia.addEventListener('change', clearZoom);

      revealPageWhenTextureIsReady();
      fetchPhotos();
    });
  </script>
</body>
</html>
