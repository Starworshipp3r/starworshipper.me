<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/assets/theme-bootstrap.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DUMBDOG WRITES THINGS</title>

  <meta name="theme-color" content="#0b0f18" />
  <meta name="description" content="A small public journal of memories, field notes, photos, and tiny moments." />
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" href="/favicon.ico?v=star-boykisser" sizes="any" />

  <link rel="stylesheet" href="/assets/tailwind.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg: #0b0f18;
      --bg2: #0a0d16;
      --fg: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.68);
      --accent: #7aa2ff;
      --accent-glow: rgba(122,162,255,.20);
      --glass: rgba(18, 22, 32, .56);
      --border: rgba(255,255,255,.14);
      --border-2: rgba(255,255,255,.10);
      --shadow: 0 30px 80px rgba(0,0,0,.55);
      --shadow-soft: 0 12px 35px rgba(0,0,0,.35);
      --radius-xl: 22px;
      --radius-lg: 16px;
      --radius-md: 14px;
      --noise: url("/assets/noise.png");
    }

    html, body { min-height: 100%; }

    body{
      font-family: "Segoe UI Variable", "Segoe UI", "Inter", system-ui, -apple-system, sans-serif;
      background: linear-gradient(180deg, var(--bg), var(--bg2));
      color: var(--fg);
      overflow-x: hidden;
    }

    @keyframes rotate-background {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    body::before{
      content:'';
      position: fixed;
      top: 50%;
      left: 50%;
      width: 150vmax;
      height: 150vmax;
      margin-top: -75vmax;
      margin-left: -75vmax;
      background-image:
        radial-gradient(circle at 26% 24%, var(--color-1, rgba(100, 100, 255, 0.25)), transparent 44%),
        radial-gradient(circle at 72% 72%, var(--color-2, rgba(255, 100, 150, 0.25)), transparent 46%),
        radial-gradient(circle at 50% 52%, rgba(122, 255, 214, .10), transparent 38%);
      z-index: -2;
      animation: rotate-background 90s linear infinite;
      animation-delay: var(--bg-delay, 0s);
      will-change: transform;
    }

    .mica-shell{
      border-radius: var(--radius-xl);
      border: 1px solid var(--border);
      background:
        linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02)),
        radial-gradient(900px 240px at 20% 0%, rgba(255,255,255,.10), transparent 60%),
        var(--glass);
      background-clip: padding-box;
      backdrop-filter: blur(28px) saturate(1.25);
      -webkit-backdrop-filter: blur(22px) saturate(1.25);
      box-shadow: var(--shadow);
      overflow: hidden;
      position: relative;
    }

    .mica-shell::before{
      content:'';
      position:absolute;
      inset: 0;
      background:
        linear-gradient(135deg, rgba(255,255,255,.20), transparent 40%),
        radial-gradient(900px 280px at 10% 0%, rgba(255,255,255,.18), transparent 60%);
      opacity: .23;
      pointer-events:none;
    }

    .mica-shell::after{
      content:'';
      position:absolute;
      inset:0;
      background-image: var(--noise);
      background-size: 128px 128px;
      opacity: .06;
      pointer-events:none;
    }

    .mica-shell > * { position: relative; z-index: 1; }

    .mica-icon-btn,
    .glass-btn{
      border: 1px solid var(--border-2);
      background: rgba(255,255,255,.06);
      box-shadow: var(--shadow-soft);
      transition: transform .15s ease, background .15s ease, border-color .15s ease, box-shadow .15s ease;
    }

    .mica-icon-btn{
      border-radius: 9999px;
      width: 44px;
      height: 44px;
      display:flex;
      align-items:center;
      justify-content:center;
      flex: 0 0 auto;
    }

    .glass-btn{
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .55rem;
      border-radius: 14px;
      min-height: 42px;
      padding: .68rem .95rem;
      color: rgba(255,255,255,.88);
      font-weight: 700;
      white-space: nowrap;
    }

    .mica-icon-btn:hover,
    .glass-btn:hover{
      transform: translateY(-1px);
      background: rgba(255,255,255,.10);
      border-color: rgba(255,255,255,.16);
    }

    .mica-icon-btn:active,
    .glass-btn:active{
      transform: translateY(0px) scale(.98);
      background: rgba(255,255,255,.08);
    }

    .glass-btn:disabled{
      opacity: .45;
      cursor: not-allowed;
      transform: none;
    }

    .resurface-btn{
      min-height: 38px;
      padding: .52rem .72rem;
      border-radius: 12px;
      font-size: .9rem;
      box-shadow: 0 10px 24px rgba(0,0,0,.24);
    }

    .resurface-btn i{
      font-size: .82rem;
    }

    .journal-search-control{
      min-width: 0;
    }

    .journal-filter-row{
      display: flex;
      align-items: center;
      gap: .5rem;
    }

    .journal-filter{
      flex: 1 1 auto;
      min-width: 0;
    }

    .glass-field{
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.055);
      color: rgba(255,255,255,.90);
      border-radius: 14px;
      min-height: 42px;
      transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
    }

    .glass-field:focus{
      outline: none;
      border-color: rgba(255,255,255,.20);
      box-shadow: 0 0 0 4px var(--accent-glow);
      background: rgba(255,255,255,.075);
    }

    .glass-field::placeholder{ color: rgba(255,255,255,.45); }

    select.glass-field option{
      background: #101723;
      color: rgba(255,255,255,.90);
    }

    .archive-card,
    .log-card,
    .empty-state{
      border-radius: var(--radius-lg);
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.05);
      box-shadow: 0 10px 28px rgba(0,0,0,.22);
    }

    .archive-card{
      padding: 1rem;
    }

    .tag{
      display:inline-flex;
      align-items:center;
      gap: .42rem;
      padding: .42rem .62rem;
      border-radius: 9999px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.05);
      color: rgba(255,255,255,.78);
      font-size: .8rem;
      line-height: 1;
      white-space: nowrap;
    }

    .log-grid{
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 305px), 1fr));
      gap: 1rem;
      align-items: stretch;
    }

    .load-more-sentinel{
      min-height: 4.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .65rem;
      color: rgba(255,255,255,.58);
      font-size: .875rem;
      contain: layout paint;
    }

    .load-more-sentinel[hidden]{ display: none; }

    .log-card{
      width: 100%;
      overflow: hidden;
      text-align: left;
      position: relative;
      display: flex;
      flex-direction: column;
      height: 100%;
      transition: transform .18s ease, background .18s ease, border-color .18s ease, box-shadow .18s ease;
    }

    .log-card:hover{
      transform: translateY(-2px);
      border-color: rgba(255,255,255,.18);
      background: rgba(255,255,255,.07);
      box-shadow: 0 18px 46px rgba(0,0,0,.34), 0 0 0 1px var(--accent-glow);
    }

    .log-card:focus-visible,
    .glass-btn:focus-visible,
    .mica-icon-btn:focus-visible{
      outline: none;
      box-shadow: 0 0 0 3px rgba(255,255,255,.18), 0 0 0 6px var(--accent-glow);
    }

    .card-media{
      position: relative;
      aspect-ratio: 16 / 9;
      background: rgba(0,0,0,.24);
      overflow: hidden;
    }

    .card-media img{
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      opacity: .92;
      transition: transform .35s ease, opacity .2s ease;
    }

    .card-media.media-contain img,
    .modal-hero.media-contain img{
      object-fit: contain;
    }

    .log-card:hover .card-media img{
      transform: scale(1.035);
      opacity: 1;
    }

    .card-media::after{
      content:'';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 45%, rgba(0,0,0,.44));
      pointer-events: none;
    }

    .category-pill{
      position: absolute;
      left: .75rem;
      bottom: .75rem;
      z-index: 1;
      display:inline-flex;
      align-items:center;
      gap:.42rem;
      padding: .38rem .58rem;
      border-radius: 9999px;
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(8,12,18,.58);
      backdrop-filter: blur(12px) saturate(1.2);
      -webkit-backdrop-filter: blur(12px) saturate(1.2);
      color: rgba(255,255,255,.88);
      font-size: .76rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .05em;
    }

    .category-pill.in-flow{
      position: static;
      display: inline-flex;
    }

    .entry-labels{
      display: flex;
      flex-wrap: wrap;
      gap: .45rem;
      margin-bottom: .75rem;
    }

    .cover-type-pill{
      position: absolute;
      top: .75rem;
      right: .75rem;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.8rem;
      height: 1.8rem;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 9999px;
      background: rgba(8,12,18,.68);
      color: rgba(255,255,255,.84);
      font-size: .7rem;
    }

    .cover-type-pill.in-flow{
      position: static;
    }

    .memory-mark{
      min-height: 142px;
      margin: .9rem .9rem 0;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.12);
      background:
        radial-gradient(circle at 20% 18%, rgba(255,255,255,.20), transparent 28%),
        radial-gradient(circle at 80% 72%, var(--accent-glow), transparent 34%),
        linear-gradient(135deg, rgba(255,255,255,.10), rgba(255,255,255,.025));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: .5rem;
      color: rgba(255,255,255,.82);
    }

    .memory-mark i{
      font-size: 2.1rem;
      filter: drop-shadow(0 10px 18px rgba(0,0,0,.35));
    }

    .memory-mark span{
      font-size: .76rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: rgba(255,255,255,.70);
    }

    .log-content{
      display: flex;
      flex: 1;
      flex-direction: column;
      padding: 1rem;
    }

    .log-excerpt{
      margin-top: .75rem;
      min-height: 4.1rem;
      color: rgba(255,255,255,.70);
      font-size: .875rem;
      line-height: 1.55;
    }

    .log-tags{
      margin-top: auto;
      padding-top: 1rem;
      display: flex;
      flex-wrap: wrap;
      gap: .5rem;
    }

    .line-clamp{
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .log-card.no-media .log-excerpt{
      min-height: 6.45rem;
    }

    .log-card.no-media .line-clamp{
      -webkit-line-clamp: 5;
    }

    @keyframes resurface-pulse{
      0%, 100% { box-shadow: 0 10px 28px rgba(0,0,0,.22), 0 0 0 0 rgba(255,255,255,0); }
      45% { box-shadow: 0 22px 56px rgba(0,0,0,.42), 0 0 0 4px var(--accent-glow); }
    }

    .log-card.is-resurfaced{
      animation: resurface-pulse 1.25s ease;
      border-color: rgba(255,255,255,.26);
    }

    .empty-state{
      padding: 2rem;
      color: rgba(255,255,255,.70);
      text-align: center;
    }

    .modal-backdrop{
      position: fixed;
      inset: 0;
      z-index: 50;
      display: grid;
      place-items: center;
      padding: 1rem;
      background: rgba(2,6,12,.72);
      backdrop-filter: blur(18px) saturate(1.25);
      -webkit-backdrop-filter: blur(18px) saturate(1.25);
      opacity: 0;
      transition: opacity 180ms ease-out;
    }

    .modal-backdrop[hidden]{ display: none; }

    .modal-backdrop.is-visible{
      opacity: 1;
    }

    .memory-modal{
      width: min(920px, 100%);
      max-height: min(86vh, 820px);
      overflow: hidden;
      border-radius: 22px;
      border: 1px solid rgba(255,255,255,.16);
      background:
        linear-gradient(180deg, rgba(255,255,255,.09), rgba(255,255,255,.035)),
        rgba(16,20,30,.86);
      box-shadow: 0 34px 90px rgba(0,0,0,.58);
      opacity: 0;
      transform: translateY(10px) scale(.985);
      transition:
        opacity 180ms ease-out,
        transform 220ms cubic-bezier(.2,.75,.25,1);
    }

    .modal-backdrop.is-visible .memory-modal{
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .memory-modal-scroll{
      max-height: inherit;
      overflow-y: auto;
      overscroll-behavior: contain;
      border-radius: inherit;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,.30) transparent;
    }

    .memory-modal-scroll::-webkit-scrollbar{
      width: 8px;
    }

    .memory-modal-scroll::-webkit-scrollbar-track{
      background: transparent;
      margin-block: 12px;
    }

    .memory-modal-scroll::-webkit-scrollbar-thumb{
      border: 2px solid transparent;
      border-radius: 999px;
      background: rgba(255,255,255,.30);
      background-clip: padding-box;
    }

    .memory-modal-scroll::-webkit-scrollbar-thumb:hover{
      background: rgba(255,255,255,.44);
      background-clip: padding-box;
    }

    .modal-hero{
      position: relative;
      min-height: 210px;
      background:
        radial-gradient(circle at 24% 24%, rgba(255,255,255,.18), transparent 30%),
        linear-gradient(135deg, rgba(122,162,255,.22), rgba(122,255,214,.08));
      overflow: hidden;
    }

    .modal-hero img{
      width: 100%;
      height: clamp(220px, 38vh, 340px);
      object-fit: cover;
      display: block;
      opacity: .94;
    }

    .modal-hero.has-image::after{
      content:'';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,.04), rgba(0,0,0,.58));
      pointer-events: none;
    }

    .modal-title-block{
      position: absolute;
      left: 1.25rem;
      right: 4.25rem;
      bottom: 1.2rem;
      z-index: 1;
      text-shadow: 0 12px 30px rgba(0,0,0,.55);
    }

    .modal-hero:not(.has-image) .modal-title-block{
      position: relative;
      inset: auto;
      padding: 4.6rem 1.25rem 1.25rem;
    }

    .modal-close{
      position: absolute;
      z-index: 2;
      top: .9rem;
      right: .9rem;
      width: 42px;
      height: 42px;
      border-radius: 9999px;
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(0,0,0,.28);
      color: rgba(255,255,255,.90);
      display: grid;
      place-items: center;
    }

    .modal-copy p + p{ margin-top: .85rem; }

    .gallery-grid{
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: .7rem;
    }

    .gallery-thumb{
      width: 100%;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: zoom-in;
      border-radius: 14px;
      transition: transform .15s ease, box-shadow .15s ease;
    }

    .gallery-thumb:hover{
      transform: translateY(-1px);
      box-shadow: 0 14px 32px rgba(0,0,0,.32);
    }

    .gallery-thumb:focus-visible{
      outline: none;
      box-shadow: 0 0 0 3px rgba(255,255,255,.18), 0 0 0 6px var(--accent-glow);
    }

    .gallery-grid img{
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      display: block;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.20);
    }

    .gallery-grid.is-single{
      display: flex;
      justify-content: center;
    }

    .gallery-grid.is-single .gallery-thumb{
      display: flex;
      justify-content: center;
      width: min(100%, 640px);
    }

    .gallery-grid.is-single img{
      width: auto;
      max-width: 100%;
      max-height: min(60vh, 640px);
      aspect-ratio: auto;
      object-fit: contain;
      transition: box-shadow .15s ease;
    }

    .gallery-grid.is-single .gallery-thumb:hover,
    .gallery-grid.is-single .gallery-thumb:focus-visible{
      box-shadow: none;
    }

    .gallery-grid.is-single .gallery-thumb:hover img{
      box-shadow: 0 14px 32px rgba(0,0,0,.32);
    }

    .gallery-grid.is-single .gallery-thumb:focus-visible img{
      box-shadow: 0 0 0 3px rgba(255,255,255,.18), 0 0 0 6px var(--accent-glow);
    }

    .video-grid{
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr));
      gap: .85rem;
    }

    .video-grid.is-single{
      grid-template-columns: minmax(0, 640px);
      justify-content: center;
    }

    .video-grid figure{
      min-width: 0;
      margin: 0;
    }

    .journal-video-thumb{
      position: relative;
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      padding: 0;
      cursor: pointer;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(0,0,0,.22);
      box-shadow: inset 0 1px rgba(255,255,255,.08);
    }

    .journal-video-thumb img{
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: .92;
      transition: transform .2s ease, opacity .2s ease;
    }

    .journal-video-thumb:hover img{
      opacity: 1;
      transform: scale(1.02);
    }

    .journal-video-thumb:focus-visible{
      outline: none;
      box-shadow: 0 0 0 3px rgba(255,255,255,.18), 0 0 0 6px var(--accent-glow);
    }

    .journal-video-play{
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: linear-gradient(180deg, rgba(0,0,0,.04), rgba(0,0,0,.42));
      color: rgba(255,255,255,.92);
      pointer-events: none;
    }

    .journal-video-play i{
      width: 3.5rem;
      height: 3.5rem;
      display: grid;
      place-items: center;
      border-radius: 9999px;
      border: 1px solid rgba(255,255,255,.15);
      background: rgba(255,255,255,.10);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 14px 32px rgba(0,0,0,.35);
      transition: transform .18s ease;
    }

    .journal-video-thumb:hover .journal-video-play i{
      transform: scale(1.05);
    }

    .video-viewer{
      position: fixed;
      inset: 0;
      z-index: 90;
      display: grid;
      place-items: center;
      padding: 1rem;
      background: rgba(2,6,12,.82);
      backdrop-filter: blur(20px) saturate(1.2);
      -webkit-backdrop-filter: blur(20px) saturate(1.2);
    }

    .video-viewer[hidden]{ display: none; }

    .video-viewer-frame{
      position: relative;
      width: min(1040px, 100%);
    }

    .video-viewer video{
      width: 100%;
      max-height: 82vh;
      display: block;
      background: rgba(0,0,0,.36);
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,.16);
      box-shadow: 0 34px 90px rgba(0,0,0,.62);
    }

    .photo-viewer{
      position: fixed;
      inset: 0;
      z-index: 80;
      display: grid;
      place-items: center;
      padding: 1rem;
      background: rgba(2,6,12,.82);
      backdrop-filter: blur(20px) saturate(1.2);
      -webkit-backdrop-filter: blur(20px) saturate(1.2);
    }

    .photo-viewer[hidden]{ display: none; }

    .photo-viewer-frame{
      position: relative;
      display: grid;
      place-items: center;
      width: min(1100px, 100%);
      max-height: 88vh;
    }

    .photo-viewer img{
      max-width: 100%;
      max-height: 88vh;
      object-fit: contain;
      touch-action: pan-y pinch-zoom;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,.16);
      background: rgba(0,0,0,.35);
      box-shadow: 0 34px 90px rgba(0,0,0,.62);
    }

    .photo-viewer-close{
      position: fixed;
      top: 1rem;
      right: 1rem;
      z-index: 1;
      width: 44px;
      height: 44px;
      border-radius: 9999px;
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(0,0,0,.34);
      color: rgba(255,255,255,.90);
      display: grid;
      place-items: center;
      box-shadow: 0 14px 32px rgba(0,0,0,.35);
    }

    .photo-viewer-nav{
      position: fixed;
      top: 50%;
      z-index: 1;
      width: 44px;
      height: 44px;
      border-radius: 9999px;
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(0,0,0,.34);
      color: rgba(255,255,255,.90);
      display: grid;
      place-items: center;
      box-shadow: 0 14px 32px rgba(0,0,0,.35);
      transform: translateY(-50%);
      transition: background .15s ease, border-color .15s ease, opacity .15s ease;
    }

    .photo-viewer-nav:hover:not(:disabled),
    .photo-viewer-nav:focus-visible{
      background: rgba(255,255,255,.13);
      border-color: rgba(255,255,255,.28);
    }

    .photo-viewer-nav:focus-visible{
      outline: none;
      box-shadow: 0 0 0 3px rgba(255,255,255,.18), 0 0 0 6px var(--accent-glow);
    }

    .photo-viewer-nav:disabled{
      opacity: .24;
      cursor: default;
    }

    .photo-viewer-prev{ left: 1rem; }
    .photo-viewer-next{ right: 1rem; }

    .photo-viewer-counter{
      position: fixed;
      left: 50%;
      bottom: max(1rem, env(safe-area-inset-bottom));
      z-index: 1;
      min-width: 3.5rem;
      padding: .38rem .7rem;
      border-radius: 9999px;
      border: 1px solid rgba(255,255,255,.16);
      background: rgba(0,0,0,.34);
      color: rgba(255,255,255,.76);
      font-size: .78rem;
      font-weight: 700;
      text-align: center;
      box-shadow: 0 10px 24px rgba(0,0,0,.30);
      transform: translateX(-50%);
    }

    .photo-viewer-nav[hidden],
    .photo-viewer-counter[hidden]{ display: none; }

    html.js .mica-shell{
      opacity: 0;
      transform: translateY(20px) scale(.97);
      filter: blur(8px);
      transition: opacity 800ms cubic-bezier(.16,.84,.44,1),
                  transform 800ms cubic-bezier(.16,.84,.44,1),
                  filter 800ms cubic-bezier(.16,.84,.44,1);
      will-change: transform, opacity, filter;
    }

    html.js body.is-ready .mica-shell{
      opacity: 1;
      transform: none;
      filter: none;
      will-change: auto;
    }

    html.js body.is-leaving .mica-shell{
      opacity: 0;
      transform: translateY(-6px) scale(.985);
      filter: none;
      transition: opacity 280ms ease-out,
                  transform 300ms cubic-bezier(.2,.8,.2,1),
                  filter 0ms linear;
    }

    @media (max-width: 760px){
      .log-header{
        align-items: flex-start;
      }

      .control-row{
        width: 100%;
        flex-direction: column;
        align-items: stretch;
      }

      .journal-search-control{
        width: 100%;
        flex: none;
      }

      .journal-filter-row{
        width: 100%;
      }

      .glass-btn{
        width: 100%;
      }

      .resurface-btn{
        width: auto;
        flex: 0 0 auto;
        align-self: stretch;
        min-height: 42px;
        padding: .48rem .68rem;
        font-size: .88rem;
      }

      .modal-backdrop{
        padding: .55rem;
        align-items: end;
        opacity: 1;
        transition: none;
      }

      .memory-modal{
        max-height: 90vh;
        border-radius: 20px 20px 0 0;
        transform: translate3d(0,24px,0);
        transition:
          opacity 180ms ease-out,
          transform 240ms cubic-bezier(.2,.8,.25,1);
        will-change: transform, opacity;
      }

      .modal-backdrop.is-visible .memory-modal{
        transform: translate3d(0,0,0);
      }

      .modal-title-block{
        left: 1rem;
        right: 3.8rem;
        bottom: 1rem;
      }

      .photo-viewer-nav{
        width: 40px;
        height: 40px;
      }

      .photo-viewer-prev{ left: .65rem; }
      .photo-viewer-next{ right: .65rem; }
    }

    @media (prefers-reduced-motion: reduce){
      body::before{ animation: none; }
      .log-card,
      .log-card:hover,
      .glass-btn,
      .mica-icon-btn,
      html.js .mica-shell{
        transition: none !important;
        transform: none !important;
      }
      .log-card.is-resurfaced{ animation: none; }
      .modal-backdrop,
      .memory-modal{
        transition: none !important;
      }
    }
  </style>
</head>

<body class="min-h-screen p-2 sm:p-4 lg:p-6">
  <div class="mica-shell w-full max-w-[1600px] mx-auto min-h-[calc(100vh-1rem)] sm:min-h-[calc(100vh-2rem)] lg:min-h-[calc(100vh-3rem)] flex flex-col">
    <header class="log-header p-5 sm:p-6 border-b border-white/10 bg-white/5 flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
      <div class="flex items-center gap-3 min-w-0">
        <a class="mica-icon-btn" href="/site/" aria-label="Back to site" title="Back">
          <i class="fa-solid fa-arrow-left"></i>
        </a>
        <div class="min-w-0">
          <div class="flex items-center gap-2 text-2xl font-extrabold leading-tight">
            <i class="fa-solid fa-book-open text-white/70 text-xl"></i>
            <span>Journal</span>
          </div>
          <p class="text-white/65 text-sm mt-1">Little public memories, field notes, and things worth saving.</p>
        </div>
      </div>

      <div class="control-row flex items-center gap-2 w-full lg:w-auto">
        <div class="journal-search-control relative flex-1 lg:flex-none">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-white/55 text-sm"></i>
          <input id="search" type="search" placeholder="Search journal"
                 class="glass-field pl-9 pr-3 py-2 w-full lg:w-64">
        </div>
        <div class="journal-filter-row">
          <select id="type-filter" class="journal-filter glass-field px-3 py-2 w-full lg:w-44" aria-label="Filter by type">
            <option value="all">All memories</option>
          </select>
          <button id="random-memory" class="glass-btn resurface-btn" type="button">
            <i class="fa-solid fa-shuffle"></i>
            <span>Resurface</span>
          </button>
        </div>
      </div>
    </header>

    <main class="p-5 sm:p-6 flex-1">
      <div class="grid grid-cols-1 xl:grid-cols-[280px_1fr] gap-5">
        <aside class="space-y-4">
          <section class="archive-card">
            <div class="text-white/55 text-xs uppercase tracking-[.14em] font-extrabold">Archive pulse</div>
            <div class="mt-3 grid grid-cols-2 gap-2">
              <span class="tag"><i class="fa-solid fa-layer-group"></i><span id="stat-count">0</span> entries</span>
              <span class="tag"><i class="fa-solid fa-tags"></i><span id="stat-types">0</span> types</span>
            </div>
            <div class="mt-3 text-white/62 text-sm">
              Latest: <span id="stat-latest" class="text-white/86 font-semibold">loading</span>
            </div>
            <div class="mt-3 border-t border-white/10 pt-3 text-white/62 text-sm leading-relaxed">
              <div>Started: <span class="text-white/86 font-semibold">June 22, 2026</span></div>
              <p class="mt-2">Older dates are backfilled memories I wanted to keep around.</p>
            </div>
          </section>

          <section class="archive-card">
            <div class="text-white/55 text-xs uppercase tracking-[.14em] font-extrabold">Tags</div>
            <div id="tag-cloud" class="mt-3 flex flex-wrap gap-2"></div>
          </section>
        </aside>

        <section>
          <div id="logs-grid" class="log-grid" aria-live="polite"></div>
          <div id="load-more-sentinel" class="load-more-sentinel" role="status" hidden>
            <i class="fa-solid fa-circle-notch fa-spin" aria-hidden="true"></i>
            <span>Loading more memories...</span>
          </div>
          <div id="empty-state" class="empty-state mt-4" hidden>
            <i class="fa-solid fa-box-archive text-3xl text-white/55"></i>
            <div class="mt-3 font-bold text-white/86">Nothing surfaced.</div>
            <div class="mt-1 text-sm">Try a different search or filter.</div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <div id="memory-modal" class="modal-backdrop" hidden>
    <article class="memory-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="memory-modal-scroll">
        <div id="modal-hero" class="modal-hero">
          <button id="modal-close" class="modal-close" type="button" aria-label="Close memory">
            <i class="fa-solid fa-xmark"></i>
          </button>
          <div id="modal-title-block" class="modal-title-block"></div>

        <div id="modal-body" class="p-5 sm:p-6"></div>

  <div id="photo-viewer" class="photo-viewer" role="dialog" aria-modal="true" aria-label="Photo viewer" hidden>
    <button id="photo-viewer-close" class="photo-viewer-close" type="button" aria-label="Close photo">
      <i class="fa-solid fa-xmark"></i>
    </button>
    <button id="photo-viewer-prev" class="photo-viewer-nav photo-viewer-prev" type="button" aria-label="Previous photo" hidden>
      <i class="fa-solid fa-chevron-left" aria-hidden="true"></i>
    </button>
    <div class="photo-viewer-frame">
      <img id="photo-viewer-image" alt="">
    </div>
    <button id="photo-viewer-next" class="photo-viewer-nav photo-viewer-next" type="button" aria-label="Next photo" hidden>
      <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
    </button>
    <div id="photo-viewer-counter" class="photo-viewer-counter" aria-live="polite" hidden></div>
  </div>

  <div id="video-viewer" class="video-viewer" hidden>
    <button id="video-viewer-close" class="photo-viewer-close" type="button" aria-label="Close video">
      <i class="fa-solid fa-xmark"></i>
    </button>
    <div class="video-viewer-frame">
      <video id="video-viewer-video" controls playsinline></video>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const root = document.documentElement;
      const KEY = 'micaTheme_v2';

      function applyTheme(t) {
        root.style.setProperty('--color-1', `hsla(${t.h1}, ${t.s}%, ${t.l}%, 0.75)`);
        root.style.setProperty('--color-2', `hsla(${t.h2}, ${t.s}%, ${t.l}%, 0.75)`);
        root.style.setProperty('--accent', `hsla(${t.h1}, ${Math.min(t.s + 10, 100)}%, ${Math.min(t.l + 15, 72)}%, 1)`);
        root.style.setProperty('--accent-glow', `hsla(${t.h1}, ${Math.min(t.s + 10, 100)}%, ${Math.min(t.l + 15, 72)}%, 0.22)`);
      }

      function generateTheme() {
        const h1 = Math.floor(Math.random() * 360);
        const roll = Math.random();
        const range = roll < 0.6
          ? { mode: 'rich', s: [55, 85], l: [45, 65] }
          : roll < 0.85
            ? { mode: 'pastel', s: [50, 75], l: [72, 84] }
            : { mode: 'moody', s: [38, 60], l: [35, 52] };
        const randomInt = ([min, max]) => Math.floor(Math.random() * (max - min + 1)) + min;
        return {
          h1,
          h2: (h1 + 180) % 360,
          s: randomInt(range.s),
          l: randomInt(range.l),
          mode: range.mode,
        };
      }

      let theme = null;
      try { theme = JSON.parse(sessionStorage.getItem(KEY) || 'null'); } catch {}
      if (!theme) {
        theme = generateTheme();
        sessionStorage.setItem(KEY, JSON.stringify(theme));
      }
      applyTheme(theme);

      const DUR = 90;
      const START_KEY = 'micaAnimStart_v1';
      let start = Number(sessionStorage.getItem(START_KEY));
      if (!start) {
        start = Date.now();
        sessionStorage.setItem(START_KEY, String(start));
      }
      const elapsed = ((Date.now() - start) / 1000) % DUR;
      root.style.setProperty('--bg-delay', `-${elapsed}s`);

      requestAnimationFrame(() => {
        requestAnimationFrame(() => document.body.classList.add('is-ready'));
      });

      document.addEventListener('click', (e) => {
        const a = e.target.closest('a');
        if (!a) return;
        if (e.button !== 0) return;
        if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
        if (a.target && a.target !== '_self') return;
        if (a.hasAttribute('download')) return;

        const href = a.getAttribute('href');
        if (!href || href.startsWith('#')) return;

        let url;
        try { url = new URL(a.href, window.location.href); } catch { return; }
        if (url.origin !== window.location.origin) return;
        if (url.pathname === location.pathname && url.search === location.search && url.hash) return;

        e.preventDefault();
        document.body.classList.add('is-leaving');
        const delay = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 300;
        setTimeout(() => { window.location.href = url.href; }, delay);
      });

      window.addEventListener('pageshow', (event) => {
        if (!event.persisted) return;
        document.body.classList.remove('is-leaving');
        document.body.classList.add('is-ready');
      });

      setTimeout(() => document.body.classList.add('is-ready'), 1200);
    });

    const els = {
      grid: document.getElementById('logs-grid'),
      loadMoreSentinel: document.getElementById('load-more-sentinel'),
      empty: document.getElementById('empty-state'),
      search: document.getElementById('search'),
      filter: document.getElementById('type-filter'),
      random: document.getElementById('random-memory'),
      statCount: document.getElementById('stat-count'),
      statTypes: document.getElementById('stat-types'),
      statLatest: document.getElementById('stat-latest'),
      tagCloud: document.getElementById('tag-cloud'),
      modal: document.getElementById('memory-modal'),
      modalHero: document.getElementById('modal-hero'),
      modalTitleBlock: document.getElementById('modal-title-block'),
      modalBody: document.getElementById('modal-body'),
      modalClose: document.getElementById('modal-close'),
      photoViewer: document.getElementById('photo-viewer'),
      photoViewerImage: document.getElementById('photo-viewer-image'),
      photoViewerClose: document.getElementById('photo-viewer-close'),
      photoViewerPrev: document.getElementById('photo-viewer-prev'),
      photoViewerNext: document.getElementById('photo-viewer-next'),
      photoViewerCounter: document.getElementById('photo-viewer-counter'),
      videoViewer: document.getElementById('video-viewer'),
      videoViewerVideo: document.getElementById('video-viewer-video'),
      videoViewerClose: document.getElementById('video-viewer-close')
    };

    let entries = [];
    let visibleEntries = [];
    let activeEntryId = '';
    let modalCloseTimer;
    let activePhotoGallery = [];
    let activePhotoIndex = -1;
    let photoSwipeStart = null;
    let renderedEntryCount = 0;
    let loadMoreObserver;

    function escapeHtml(value){
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function asArray(value){
      return Array.isArray(value) ? value.filter(Boolean) : [];
    }

    function slugify(value, fallback){
      const slug = String(value || '')
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-+|-+$/g, '');
      return slug || `memory-${fallback}`;
    }

    function entryIdFromUrl(){
      return new URL(window.location.href).searchParams.get('entry') || '';
    }

    function journalUrl(entryId = ''){
      const url = new URL(window.location.href);
      if (entryId) {
        url.searchParams.set('entry', entryId);
      } else {
        url.searchParams.delete('entry');
      }
      return url;
    }

    function formatDate(iso){
      if (!iso) return '';
      const date = new Date(`${iso}T00:00:00`);
      if (Number.isNaN(date.getTime())) return iso;
      return date.toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' });
    }

    function shortDate(iso){
      if (!iso) return '';
      const date = new Date(`${iso}T00:00:00`);
      if (Number.isNaN(date.getTime())) return iso;
      return date.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function entryType(entry){
      return entry.type || entry.category || 'memory';
    }

    function primaryImage(entry){
      return entry.coverImage || asArray(entry.photos)[0] || '';
    }

    function galleryImages(entry){
      return Array.from(new Set([entry.coverImage, ...asArray(entry.photos)].filter(Boolean)));
    }

    function videoItems(entry){
      const fallbackPoster = primaryImage(entry);
      return asArray(entry.videos)
        .map((video, index) => {
          const title = video?.title || `Attached video ${index + 1}`;
          if (typeof video === 'string') {
            return {
              src: video,
              title: `Attached video ${index + 1}`,
              poster: fallbackPoster
            };
          }
          return {
            src: video?.src || '',
            title,
            poster: video?.poster || fallbackPoster,
            type: video?.type || 'video/mp4'
          };
        })
        .filter(video => video.src);
    }

    function iconFor(type){
      const key = String(type || '').toLowerCase();
      if (key.includes('music')) return 'fa-compact-disc';
      if (key.includes('photo')) return 'fa-camera-retro';
      if (key.includes('outside') || key.includes('field')) return 'fa-leaf';
      if (key.includes('site')) return 'fa-display';
      return 'fa-note-sticky';
    }

    function setStats(source){
      const types = new Set(source.map(entryType));
      const tags = Array.from(new Set(source.flatMap(entry => asArray(entry.tags)))).sort((a, b) => a.localeCompare(b));
      if (els.statCount) els.statCount.textContent = String(source.length);
      if (els.statTypes) els.statTypes.textContent = String(types.size);
      if (els.statLatest) els.statLatest.textContent = source[0] ? shortDate(source[0].date) : 'none yet';
      if (els.tagCloud) {
        els.tagCloud.innerHTML = tags.length
          ? tags.slice(0, 18).map(tag => `<span class="tag"><i class="fa-solid fa-hashtag"></i>${escapeHtml(tag)}</span>`).join('')
          : '<span class="text-white/55 text-sm">No tags yet.</span>';
      }
    }

    function buildFilterOptions(){
      const types = Array.from(new Set(entries.map(entryType))).sort((a, b) => a.localeCompare(b));
      els.filter.innerHTML = '<option value="all">All memories</option>' + types
        .map(type => `<option value="${escapeHtml(type)}">${escapeHtml(type)}</option>`)
        .join('');
    }

    function cardTemplate(entry){
      const type = entryType(entry);
      const image = primaryImage(entry);
      const tags = asArray(entry.tags).slice(0, 4);
      const mediaFit = entry.coverFit === 'contain' ? ' media-contain' : '';
      const albumArtLabel = entry.coverType === 'album-art'
        ? '<span class="cover-type-pill" role="img" aria-label="Album art" title="Album art"><i class="fa-solid fa-compact-disc" aria-hidden="true"></i></span>'
        : '';
      const location = entry.location ? `<span><i class="fa-solid fa-location-dot text-white/45"></i> ${escapeHtml(entry.location)}</span>` : '';
      const media = image
        ? `<div class="card-media${mediaFit}">
             <img src="${escapeHtml(image)}" alt="" loading="lazy">
             <span class="category-pill"><i class="fa-solid ${iconFor(type)}"></i>${escapeHtml(type)}</span>
             ${albumArtLabel}
           </div>`
        : `<div class="memory-mark" aria-hidden="true">
             <i class="fa-solid ${iconFor(type)}"></i>
             <span>${escapeHtml(type)}</span>
           </div>`;

      return `
        ${media}
        <div class="log-content">
          <div class="flex items-start justify-between gap-3">
            <div class="min-w-0">
              <div class="text-white/55 text-xs font-extrabold uppercase tracking-[.12em]">${escapeHtml(shortDate(entry.date))}</div>
              <h2 class="mt-1 text-lg font-extrabold leading-tight">${escapeHtml(entry.title)}</h2>
            </div>
            <i class="fa-solid fa-arrow-up-right-from-square text-white/35 mt-1"></i>
          </div>
          <div class="mt-2 flex flex-wrap items-center gap-x-3 gap-y-1 text-white/58 text-sm">
            ${location}
          </div>
          <p class="log-excerpt line-clamp">${escapeHtml(entry.body)}</p>
          <div class="log-tags">
            ${tags.map(tag => `<span class="tag"><i class="fa-solid fa-hashtag"></i>${escapeHtml(tag)}</span>`).join('')}
          </div>
        </div>
      `;
    }

    function batchSize(initial = false){
      const isMobile = window.matchMedia('(max-width: 767px)').matches;
      if (initial) return isMobile ? 8 : 12;
      return isMobile ? 6 : 9;
    }

    function createCard(entry){
      const card = document.createElement('button');
      card.type = 'button';
      card.className = `log-card ${primaryImage(entry) ? '' : 'no-media'}`;
      card.dataset.id = entry.id;
      card.innerHTML = cardTemplate(entry);
      card.addEventListener('click', () => openModal(entry.id));
      return card;
    }

    function updateLoadMoreSentinel(){
      if (!els.loadMoreSentinel) return;
      els.loadMoreSentinel.hidden = !visibleEntries.length || renderedEntryCount >= visibleEntries.length;
    }

    function appendNextBatch({ minimumIndex = -1, initial = false } = {}){
      if (!els.grid || renderedEntryCount >= visibleEntries.length) {
        updateLoadMoreSentinel();
        return;
      }

      const requestedEnd = renderedEntryCount + batchSize(initial);
      const requiredEnd = minimumIndex >= 0 ? minimumIndex + 1 : 0;
      const end = Math.min(visibleEntries.length, Math.max(requestedEnd, requiredEnd));
      const fragment = document.createDocumentFragment();

      visibleEntries.slice(renderedEntryCount, end).forEach(entry => {
        fragment.appendChild(createCard(entry));
      });

      els.grid.appendChild(fragment);
      renderedEntryCount = end;
      updateLoadMoreSentinel();
    }

    function renderCards(){
      if (!els.grid) return;
      els.grid.innerHTML = '';
      renderedEntryCount = 0;
      if (els.empty) els.empty.hidden = visibleEntries.length > 0;

      if (!visibleEntries.length) {
        updateLoadMoreSentinel();
        return;
      }

      if (!('IntersectionObserver' in window)) {
        appendNextBatch({ minimumIndex: visibleEntries.length - 1 });
        return;
      }

      appendNextBatch({ initial: true });
    }

    function applyFilters(){
      const query = (els.search?.value || '').trim().toLowerCase();
      const filter = els.filter?.value || 'all';
      visibleEntries = entries.filter(entry => {
        const type = entryType(entry);
        const haystack = [
          entry.title,
          entry.body,
          type,
          entry.location,
          ...asArray(entry.tags),
          ...videoItems(entry).map(video => video.title)
        ].join(' ').toLowerCase();
        return (!query || haystack.includes(query)) && (filter === 'all' || type === filter);
      });
      if (els.random) els.random.disabled = visibleEntries.length === 0;
      renderCards();
    }

    function paragraphs(body){
      const formatInline = value => escapeHtml(value)
        .replace(/~~(.+?)~~/g, '<s>$1</s>')
        .replace(/\*(.+?)\*/g, '<em>$1</em>');
      return String(body || '')
        .split(/\n{2,}/)
        .map(part => part.trim())
        .filter(Boolean)
        .map(part => {
          const italic = part.match(/^\*(.+)\*$/s);
          return italic
            ? `<p><em>${formatInline(italic[1])}</em></p>`
            : `<p>${formatInline(part)}</p>`;
        })
        .join('');
    }

    function openModal(id, { syncHistory = true } = {}){
      const entry = entries.find(item => item.id === id);
      if (!entry || !els.modal) return;

      if (syncHistory && entryIdFromUrl() !== id) {
        history.pushState({ journalEntry: id }, '', journalUrl(id));
      }

      const type = entryType(entry);
      const image = primaryImage(entry);
      const gallery = asArray(entry.photos);
      const hasPhotos = asArray(entry.photos).length > 0;
      const videos = videoItems(entry);
      const albumArtLabel = entry.coverType === 'album-art'
        ? '<span class="cover-type-pill in-flow" role="img" aria-label="Album art" title="Album art"><i class="fa-solid fa-compact-disc" aria-hidden="true"></i></span>'
        : '';
      const meta = [
        formatDate(entry.date),
        entry.location
      ].filter(Boolean).join(' · ');

      els.modalHero.className = `modal-hero ${image ? 'has-image' : ''} ${entry.coverFit === 'contain' ? 'media-contain' : ''}`;
      els.modalHero.querySelector('img')?.remove();
      if (image) {
        els.modalHero.insertAdjacentHTML('afterbegin', `<img src="${escapeHtml(image)}" alt="">`);
      }

      els.modalTitleBlock.innerHTML = `
        <div class="entry-labels">
          <span class="category-pill in-flow"><i class="fa-solid ${iconFor(type)}"></i>${escapeHtml(type)}</span>
          ${albumArtLabel}
        </div>
        <h2 id="modal-title" class="text-3xl sm:text-4xl font-extrabold leading-tight">${escapeHtml(entry.title)}</h2>
        <div class="mt-2 text-white/75 text-sm font-semibold">${escapeHtml(meta)}</div>
      `;

      els.modalBody.innerHTML = `
        <div class="modal-copy text-white/76 leading-relaxed">${paragraphs(entry.body)}</div>
        <div class="mt-5 flex flex-wrap gap-2">
          ${asArray(entry.tags).map(tag => `<span class="tag"><i class="fa-solid fa-hashtag"></i>${escapeHtml(tag)}</span>`).join('')}
        </div>
        ${hasPhotos && gallery.length ? `
          <div class="mt-6">
            <div class="text-white/55 text-xs uppercase tracking-[.14em] font-extrabold mb-3">Photos</div>
            <div class="gallery-grid${gallery.length === 1 ? ' is-single' : ''}">
              ${gallery.map((src, index) => `
                <button class="gallery-thumb" type="button" data-photo-src="${escapeHtml(src)}" aria-label="Open photo ${index + 1}">
                  <img src="${escapeHtml(src)}" alt="" loading="lazy">
                </button>
              `).join('')}
            </div>
          </div>
        ` : ''}
        ${videos.length ? `
          <div class="mt-6">
            <div class="text-white/55 text-xs uppercase tracking-[.14em] font-extrabold mb-3">Videos</div>
            <div class="video-grid${videos.length === 1 ? ' is-single' : ''}" aria-label="Attached videos">
              ${videos.map(video => `
                <figure>
                  <button
                    class="journal-video-thumb"
                    type="button"
                    data-video-src="${escapeHtml(video.src)}"
                    data-video-title="${escapeHtml(video.title)}"
                    data-video-poster="${escapeHtml(video.poster || '')}"
                    aria-label="Play ${escapeHtml(video.title)}"
                  >
                    <img src="${escapeHtml(video.poster || image || '')}" alt="" loading="lazy">
                    <span class="journal-video-play" aria-hidden="true">
                      <i class="fa-solid fa-play"></i>
                    </span>
                  </button>
                </figure>
              `).join('')}
            </div>
          </div>
        ` : ''}
      `;

      clearTimeout(modalCloseTimer);
      els.modal.classList.remove('is-visible');
      els.modal.hidden = false;
      activeEntryId = id;
      document.body.style.overflow = 'hidden';
      void els.modal.offsetWidth;
      els.modal.classList.add('is-visible');
      els.modalClose?.focus({ preventScroll: true });
    }

    function renderPhotoViewer(){
      if (!els.photoViewerImage || !activePhotoGallery.length || activePhotoIndex < 0) return;

      const gallerySize = activePhotoGallery.length;
      els.photoViewerImage.src = activePhotoGallery[activePhotoIndex];
      els.photoViewerImage.alt = `Photo ${activePhotoIndex + 1} of ${gallerySize}`;

      const hasMultiplePhotos = gallerySize > 1;
      if (els.photoViewerPrev) {
        els.photoViewerPrev.hidden = !hasMultiplePhotos;
        els.photoViewerPrev.disabled = activePhotoIndex === 0;
      }
      if (els.photoViewerNext) {
        els.photoViewerNext.hidden = !hasMultiplePhotos;
        els.photoViewerNext.disabled = activePhotoIndex === gallerySize - 1;
      }
      if (els.photoViewerCounter) {
        els.photoViewerCounter.hidden = !hasMultiplePhotos;
        els.photoViewerCounter.textContent = `${activePhotoIndex + 1} / ${gallerySize}`;
      }
    }

    function showAdjacentPhoto(direction){
      const nextIndex = activePhotoIndex + direction;
      if (nextIndex < 0 || nextIndex >= activePhotoGallery.length) return;
      activePhotoIndex = nextIndex;
      renderPhotoViewer();
    }

    function openPhotoViewer(src, gallery = [src], requestedIndex = -1){
      if (!src || !els.photoViewer || !els.photoViewerImage) return;
      activePhotoGallery = Array.from(new Set(asArray(gallery)));
      if (!activePhotoGallery.includes(src)) activePhotoGallery.unshift(src);
      activePhotoIndex = requestedIndex >= 0
        ? Math.min(requestedIndex, activePhotoGallery.length - 1)
        : activePhotoGallery.indexOf(src);
      renderPhotoViewer();
      els.photoViewer.hidden = false;
      document.body.style.overflow = 'hidden';
      els.photoViewerClose?.focus({ preventScroll: true });
    }

    function closePhotoViewer({ keepBodyLocked = false } = {}){
      if (!els.photoViewer || els.photoViewer.hidden) return;
      els.photoViewer.hidden = true;
      els.photoViewerImage?.removeAttribute('src');
      activePhotoGallery = [];
      activePhotoIndex = -1;
      photoSwipeStart = null;
      if (!keepBodyLocked && els.modal?.hidden) {
        document.body.style.overflow = '';
      }
    }

    function openVideoViewer({ src, title, poster }){
      if (!src || !els.videoViewer || !els.videoViewerVideo) return;
      els.videoViewerVideo.pause();
      els.videoViewerVideo.removeAttribute('src');
      if (poster) {
        els.videoViewerVideo.setAttribute('poster', poster);
      } else {
        els.videoViewerVideo.removeAttribute('poster');
      }
      els.videoViewerVideo.setAttribute('src', src);
      els.videoViewerVideo.setAttribute('aria-label', title || 'Attached video');
      els.videoViewerVideo.load();
      els.videoViewer.hidden = false;
      document.body.style.overflow = 'hidden';
      els.videoViewerVideo.play().catch(() => {});
      els.videoViewerClose?.focus({ preventScroll: true });
    }

    function closeVideoViewer({ keepBodyLocked = false } = {}){
      if (!els.videoViewer || els.videoViewer.hidden) return;
      els.videoViewerVideo?.pause();
      els.videoViewerVideo?.removeAttribute('src');
      els.videoViewerVideo?.removeAttribute('poster');
      els.videoViewerVideo?.removeAttribute('aria-label');
      els.videoViewerVideo?.load();
      els.videoViewer.hidden = true;
      if (!keepBodyLocked && els.modal?.hidden) {
        document.body.style.overflow = '';
      }
    }

    function closeModal({ syncHistory = true } = {}){
      if (!els.modal) return;

      const entryId = entryIdFromUrl();
      if (syncHistory && entryId) {
        if (history.state?.journalEntry === entryId) {
          history.back();
          return;
        }
        history.replaceState(history.state, '', journalUrl());
      }

      closePhotoViewer({ keepBodyLocked: true });
      closeVideoViewer({ keepBodyLocked: true });
      clearTimeout(modalCloseTimer);
      els.modal.classList.remove('is-visible');
      activeEntryId = '';
      document.body.style.overflow = '';

      const finishClose = () => {
        if (!activeEntryId && !els.modal.classList.contains('is-visible')) {
          els.modal.hidden = true;
        }
      };
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        finishClose();
      } else {
        modalCloseTimer = setTimeout(finishClose, 260);
      }
    }

    function syncModalToUrl(){
      const entryId = entryIdFromUrl();
      if (!entryId) {
        if (activeEntryId || !els.modal?.hidden) closeModal({ syncHistory: false });
        return;
      }

      if (!entries.some(entry => entry.id === entryId)) {
        history.replaceState(history.state, '', journalUrl());
        closeModal({ syncHistory: false });
        return;
      }

      if (activeEntryId !== entryId || els.modal?.hidden) {
        openModal(entryId, { syncHistory: false });
      }
    }

    function resurfaceMemory(){
      if (!visibleEntries.length) return;
      const entry = visibleEntries[Math.floor(Math.random() * visibleEntries.length)];
      const entryIndex = visibleEntries.findIndex(item => item.id === entry.id);
      if (entryIndex >= renderedEntryCount) appendNextBatch({ minimumIndex: entryIndex });
      const card = document.querySelector(`[data-id="${CSS.escape(entry.id)}"]`);
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (card) {
        card.classList.remove('is-resurfaced');
        card.scrollIntoView({ behavior: reducedMotion ? 'auto' : 'smooth', block: 'center' });
        requestAnimationFrame(() => card.classList.add('is-resurfaced'));
      }
      setTimeout(() => openModal(entry.id), reducedMotion ? 0 : 520);
    }

    function observeLoadMoreSentinel(){
      if (!els.loadMoreSentinel || !('IntersectionObserver' in window)) return;
      loadMoreObserver = new IntersectionObserver(entries => {
        if (entries.some(entry => entry.isIntersecting)) appendNextBatch();
      }, { rootMargin: '420px 0px', threshold: 0 });
      loadMoreObserver.observe(els.loadMoreSentinel);
    }

    async function loadLogs(){
      try {
        const response = await fetch('/site/data/journal.json', { cache: 'no-cache' });
        if (!response.ok) throw new Error(`Unable to load journal: ${response.status}`);
        const data = await response.json();
        const rawEntries = Array.isArray(data) ? data : asArray(data.entries);
        entries = rawEntries
          .map((entry, index) => ({
            ...entry,
            id: entry.id || slugify(`${entry.date || ''}-${entry.title || ''}`, index)
          }))
          .sort((a, b) => new Date(`${b.date}T00:00:00`) - new Date(`${a.date}T00:00:00`));
        buildFilterOptions();
        setStats(entries);
        applyFilters();
        syncModalToUrl();
      } catch (error) {
        console.error(error);
        if (els.empty) {
          els.empty.hidden = false;
          els.empty.innerHTML = `
            <i class="fa-solid fa-triangle-exclamation text-3xl text-white/55"></i>
            <div class="mt-3 font-bold text-white/86">The journal archive did not load.</div>
            <div class="mt-1 text-sm">Check <code class="text-white/80">/site/data/journal.json</code>.</div>
          `;
        }
      }
    }

    els.search?.addEventListener('input', applyFilters);
    els.filter?.addEventListener('change', applyFilters);
    els.random?.addEventListener('click', resurfaceMemory);
    observeLoadMoreSentinel();
    els.modalBody?.addEventListener('click', (event) => {
      const thumb = event.target.closest('.gallery-thumb');
      if (thumb) {
        const thumbs = Array.from(els.modalBody.querySelectorAll('.gallery-thumb'));
        const gallery = thumbs.map(item => item.dataset.photoSrc).filter(Boolean);
        openPhotoViewer(thumb.dataset.photoSrc, gallery, thumbs.indexOf(thumb));
        return;
      }

      const video = event.target.closest('.journal-video-thumb');
      if (video) {
        openVideoViewer({
          src: video.dataset.videoSrc,
          title: video.dataset.videoTitle,
          poster: video.dataset.videoPoster
        });
      }
    });
    els.modalClose?.addEventListener('click', closeModal);
    els.modal?.addEventListener('click', (event) => {
      if (event.target === els.modal) closeModal();
    });
    els.photoViewerClose?.addEventListener('click', () => closePhotoViewer());
    els.photoViewerPrev?.addEventListener('click', () => showAdjacentPhoto(-1));
    els.photoViewerNext?.addEventListener('click', () => showAdjacentPhoto(1));
    els.photoViewer?.addEventListener('click', (event) => {
      if (!event.target.closest('#photo-viewer-image, #photo-viewer-close, .photo-viewer-nav, .photo-viewer-counter')) {
        closePhotoViewer();
      }
    });
    els.photoViewerImage?.addEventListener('touchstart', (event) => {
      const touch = event.touches[0];
      if (!touch) return;
      photoSwipeStart = { x: touch.clientX, y: touch.clientY };
    }, { passive: true });
    els.photoViewerImage?.addEventListener('touchend', (event) => {
      if (!photoSwipeStart) return;
      const touch = event.changedTouches[0];
      if (!touch) return;

      const deltaX = touch.clientX - photoSwipeStart.x;
      const deltaY = touch.clientY - photoSwipeStart.y;
      photoSwipeStart = null;
      if (Math.abs(deltaX) < 48 || Math.abs(deltaX) <= Math.abs(deltaY)) return;
      showAdjacentPhoto(deltaX < 0 ? 1 : -1);
    }, { passive: true });
    els.videoViewerClose?.addEventListener('click', () => closeVideoViewer());
    els.videoViewer?.addEventListener('click', (event) => {
      if (!event.target.closest('.video-viewer-frame, #video-viewer-close')) {
        closeVideoViewer();
      }
    });
    window.addEventListener('popstate', syncModalToUrl);
    window.addEventListener('keydown', (event) => {
      if (!els.videoViewer?.hidden) {
        if (event.key === 'Escape') closeVideoViewer();
        return;
      }
      if (!els.photoViewer?.hidden) {
        if (event.key === 'Escape') closePhotoViewer();
        if (event.key === 'ArrowLeft') {
          event.preventDefault();
          showAdjacentPhoto(-1);
        }
        if (event.key === 'ArrowRight') {
          event.preventDefault();
          showAdjacentPhoto(1);
        }
        return;
      }
      if (event.key !== 'Escape') return;
      if (!els.modal?.hidden) closeModal();
    });

    loadLogs();
  </script>
</body>
</html>
